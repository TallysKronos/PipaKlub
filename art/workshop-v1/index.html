</style><main class="workshop-room"><header><div class="eyebrow">Soulmonsters · Elo das Ruínas</div><h1>Oficina das Almas</h1><p>Do primeiro encaixe ao primeiro movimento. Explore a construção do Rabbito na bancada do Sr. Assis.</p><small>Prévia visual interativa · sem conta, consumo de itens ou concessão de parceiros.</small></header><nav class="preview-tabs" id="tabs" aria-label="Etapas para revisão"></nav><div class="workshop-layout"><div class="workshop-scene"><canvas id="scene" width="960" height="640" aria-label="Rabbito na bancada animada"></canvas></div><aside class="workshop-controls"><div id="tool" class="eyebrow"></div><h3 id="title"></h3><p id="hint"></p><div id="inputs"></div><div class="workshop-readout"><span id="score"></span><small>Qualidade visual · sem bônus de combate</small></div><button id="next" class="primary"></button><button id="redo" class="secondary">Refazer etapa</button></aside></div><footer class="preview-footer"><button id="pause">Pausar animação</button><label><input id="reduced" type="checkbox"> Movimento reduzido</label><label>Velocidade <select id="speed"><option value="1">1×</option><option value="0.35">0,35×</option></select></label><span id="status" role="status">Carregando arte…</span></footer></main><script>

const WORKSHOP_STAGES=[
 {id:'frame',name:'Armação',tool:'Varetas de bambu',title:'Dê estrutura ao corpo.',hint:'Toque nos quatro apoios da bancada em ordem, ou use os botões. O gabarito mantém a estrutura alinhada.',action:'Confirmar armação'},
 {id:'knots',name:'Nós',tool:'Linha e amarração',title:'Firme cada encontro.',hint:'Ajuste a tensão para 65. Um nó firme sustenta a vela sem apertar demais a armação.',action:'Firmar os nós'},
 {id:'paper',name:'Papel',tool:'Estilete e tesourinha',title:'Revele a marca da alma.',hint:'Retalhos colados escondem a forma do parceiro. O estilete arranca uma camada por golpe, mas rasga onde a marca já aparece; a tesourinha raspa devagar. A Luz do molde mostra a marca por instantes.',action:'Aplicar o papel'},
 {id:'balance',name:'Equilíbrio',tool:'Ponto de amarração',title:'Encontre o ponto de voo.',hint:'Mova o ponto de amarração até 50. Observe a inclinação da montagem e a estabilidade.',action:'Confirmar equilíbrio'},
 {id:'soul',name:'Elo',tool:'Rabiola da alma',title:'Uma alma. Um novo começo.',hint:'Equilibre vento e tensão em 50 e una a rabiola. A linha será o elo de manifestação.',action:'Unir rabiola e despertar'}

function workshopInput(){return {joints:[],cuts:[],tension:35,balance:25,wind:35,soulTension:70,revealScore:null};}
function workshopPayload(stage,input){
 if(stage===0)return {joints:[...input.joints]};
 if(stage===1)return {tension:Number(input.tension)};
 if(stage===2)return input.revealScore==null?{cuts:[...input.cuts]}:{cuts:[...input.cuts],reveal:Math.max(0,Math.min(100,Math.round(input.revealScore)))};
 if(stage===3)return {balance:Number(input.balance)};
 if(stage===4)return {wind:Number(input.wind),tension:Number(input.soulTension)};
 throw Error('Etapa de montagem inválida.');
}
function workshopReady(stage,input){return stage===0?input.joints.length===4:stage===2?input.cuts.length===4:stage>=1&&stage<=4;}
function validWorkshopPayload(stage,payload){
 if(!payload||typeof payload!=='object'||Array.isArray(payload))return false;
 if(stage===0||stage===2){const key=stage===0?'joints':'cuts',extra=stage===2&&'reveal' in payload;if(extra&&!(Number.isInteger(payload.reveal)&&payload.reveal>=0&&payload.reveal<=100))return false;return Object.keys(payload).length===(extra?2:1)&&Array.isArray(payload[key])&&payload[key].length===4&&payload[key].every((v,i)=>v===i);}
 const keys=stage===1?['tension']:stage===3?['balance']:stage===4?['wind','tension']:[];
 return keys.length>0&&Object.keys(payload).length===keys.length&&keys.every(k=>Number.isInteger(payload[k])&&payload[k]>=0&&payload[k]<=100);

function workshopQuality(stage,input){return stage===1?Math.max(0,100-Math.abs(input.tension-65)*2):stage===3?Math.max(0,100-Math.abs(input.balance-50)*2):stage===4?Math.max(0,100-Math.abs(input.wind-50)-Math.abs(input.soulTension-50)):100;}
function workshopPose(stage,input,time,reduced=false){
 const motion=reduced?0:1,settled=stage>=5;
 return {rise:settled?Math.sin(time*2)*4*motion:0,tilt:(stage===3?(input.balance-50)*.14:0)+Math.sin(time*1.8)*.8*motion*(settled?1:0),ear:Math.sin(time*2.3)*.025*motion,tail:Math.sin(time*2.3-.7)*.06*motion,glow:stage===4?(workshopQuality(stage,input)/100):settled?1:0};
}

// Oficina das Almas · etapa do papel: a marca da alma está sob retalhos colados e precisa ser revelada sem rasgar.
// Estilete = arranca uma camada num raio largo e rasga onde a marca já aparece; tesourinha = raspa devagar.
// Coordenadas locais da bancada (centro da criatura em 0,0), como em workshop-renderer.js.
const REVEAL_CELL=6,REVEAL_AREA={x:-132,y:-192,w:264,h:342},REVEAL_SECONDS=90,REVEAL_COUNTDOWN=3,REVEAL_FAIL=.5,REVEAL_DONE=.9,REVEAL_LIGHTS=2;
const REVEAL_TOOLS={estilete:{radius:24,shock:34,tear:.45,shockTear:.12},tesourinha:{radius:9,layer:.3,tear:.008}};
// Papel do kit do ateliê: manteiga (equilibrado). Outros papéis entram com a economia de materiais.
const REVEAL_PAPER={fragility:1,cover:[1.2,2.4],lightDepth:3};
function revealRandom(seed){let s=seed>>>0||1;return ()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
// mask(x,y) diz se o ponto local pertence à marca (silhueta real da espécie).
function createReveal(mask,seed=1){
 const r=revealRandom(seed),cols=Math.floor(REVEAL_AREA.w/REVEAL_CELL),rows=Math.floor(REVEAL_AREA.h/REVEAL_CELL),cells=[];
 const blobs=Array.from({length:8},()=>({x:REVEAL_AREA.x+r()*REVEAL_AREA.w,y:REVEAL_AREA.y+r()*REVEAL_AREA.h,s:30+r()*60,a:r()*.9}));
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
  const x=REVEAL_AREA.x+i*REVEAL_CELL+REVEAL_CELL/2,y=REVEAL_AREA.y+j*REVEAL_CELL+REVEAL_CELL/2,piece=!!mask(x,y);
  let cover=REVEAL_PAPER.cover[0]+(REVEAL_PAPER.cover[1]-REVEAL_PAPER.cover[0])*r()*.5;
  for(const b of blobs){const d=Math.hypot(x-b.x,y-b.y);if(d<b.s)cover+=b.a*(1-d/b.s);}
  if(!piece)cover+=.6;
  cells.push({x,y,piece,cover:Math.min(3,cover),damage:0});
 }
 return {seed,cols,rows,cells,lights:REVEAL_LIGHTS,lightUntil:0,flashes:[],strikes:0};
}
function revealAround(state,x,y,radius,fn){
 const i0=Math.max(0,Math.floor((x-radius-REVEAL_AREA.x)/REVEAL_CELL)),i1=Math.min(state.cols-1,Math.floor((x+radius-REVEAL_AREA.x)/REVEAL_CELL));
 const j0=Math.max(0,Math.floor((y-radius-REVEAL_AREA.y)/REVEAL_CELL)),j1=Math.min(state.rows-1,Math.floor((y+radius-REVEAL_AREA.y)/REVEAL_CELL));
 for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const c=state.cells[j*state.cols+i],d=Math.hypot(c.x-x,c.y-y);if(d<=radius)fn(c,d);}
}
function revealStrike(state,tool,x,y){
 const t=REVEAL_TOOLS[tool],f=REVEAL_PAPER.fragility;if(!t)return revealScore(state);state.strikes++;
 if(tool==='estilete')revealAround(state,x,y,t.shock,(c,d)=>{
  if(d<=t.radius){const left=c.cover-(1-.4*d/t.radius);if(left<0&&c.piece)c.damage=Math.min(1,c.damage-left*t.tear*f);c.cover=Math.max(0,left);}
  else if(c.piece&&c.cover<.3)c.damage=Math.min(1,c.damage+t.shockTear*f*(1-d/t.shock));
 });
 else revealAround(state,x,y,t.radius,c=>{const left=c.cover-t.layer;if(left<0&&c.piece)c.damage=Math.min(1,c.damage+t.tear*f);c.cover=Math.max(0,left);});
 return revealScore(state);
}
// Nota = quanto da marca apareceu × (1 − rasgo médio). Rasgo médio de 50% faz a folha ceder.
function revealScore(state){
 let n=0,shown=0,dmg=0;for(const c of state.cells)if(c.piece){n++;if(c.cover<=.05)shown++;dmg+=c.damage;}
 const revealed=n?shown/n:0,damage=n?dmg/n:0;

}
const revealLightVisible=c=>c.piece&&c.cover<=REVEAL_PAPER.lightDepth;
// Máscara pela silhueta real: as mesmas peças e posições que o renderer usa para o Rabbito; demais espécies usam o losango do gabarito.
function revealMask(parts,rects,rabbit){
 if(!rabbit||!parts?.complete||!rects||typeof document==='undefined'){const pts=[[0,-100],[105,0],[0,100],[-105,0]];return (x,y)=>{let inside=false;for(let i=0,j=3;i<4;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;}return inside;};}
 const c=document.createElement('canvas');c.width=REVEAL_AREA.w;c.height=REVEAL_AREA.h;const g=c.getContext('2d',{willReadFrequently:true});g.translate(-REVEAL_AREA.x,-REVEAL_AREA.y);
 for(const [id,x,y,w,h,px,py] of [['body',0,30,148,178,.5,.5],['earFar',28,-47,42,113,.5,.94],['earNear',-25,-47,66,119,.5,.94]]){const r=rects[id];if(r)g.drawImage(parts,...r,x-w*px,y-h*py,w,h);}

}
const REVEAL_COVER=['#efe2c4','#e2cfa6','#cdb487','#b39a6c'];
// Desenha sobre a marca (já pintada pelo renderer) os retalhos, rasgos, a Luz e o cursor da ferramenta.
function drawWorkshopReveal(g,state,time,{tool,cursor,lit,reduced}){
 for(const c of state.cells){
  if(c.piece&&c.damage>.02){g.fillStyle='rgba(168,50,42,'+Math.min(.85,c.damage*1.2)+')';g.fillRect(c.x-3,c.y-3,REVEAL_CELL,REVEAL_CELL);}
  if(c.cover>.05){g.fillStyle=REVEAL_COVER[Math.min(3,Math.floor(c.cover))];g.fillRect(c.x-3,c.y-3,REVEAL_CELL,REVEAL_CELL);if(((c.x*7+c.y*13)|0)%5===0){g.fillStyle='#0000000d';g.fillRect(c.x-3,c.y-1,REVEAL_CELL,1);}}
 }
 if(lit){g.fillStyle='rgba(64,224,208,.45)';for(const c of state.cells)if(c.cover>.05&&revealLightVisible(c))g.fillRect(c.x-3,c.y-3,REVEAL_CELL,REVEAL_CELL);}

 if(cursor){g.strokeStyle='#c14e22';g.lineWidth=2;g.beginPath();g.arc(cursor.x,cursor.y,REVEAL_TOOLS[tool]?.radius||10,0,7);g.stroke();}
}

// Canvas composition: art retains its original colour; guides are functional geometry.
function createWorkshopRenderer({bench,parts,rects,drawCreature,reduced=()=>false}){
 let lastStage=-1,stageAt=0,lastCount=-1,countAt=0;
