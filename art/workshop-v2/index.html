<section class="workshop-room craft-mode is-building"><section id="workshopBuild"><div class="workshop-hud"><button id="reset" class="secondary">↶ Nova pipa</button><nav class="workshop-steps" id="steps" aria-label="Etapas da fabricação"></nav><select id="difficulty" aria-label="Classe do gabarito"><option value="common">Comum</option><option value="uncommon">Incomum</option><option value="rare">Raro</option></select></div><div class="workshop-layout"><div class="workshop-scene"><canvas id="scene" width="960" height="640" aria-label="Bancada de montagem: gabarito no centro, ferramentas à esquerda e materiais à direita"></canvas><div id="tools" class="craft-tools" role="group" aria-label="Ferramentas da bancada"></div><span id="class" class="craft-class"></span><button id="motion" class="workshop-motion">Reduzir movimento</button><button id="pause" class="craft-pause">Pausar</button><span class="craft-key-help">1–6 ferramentas · Setas movem · Espaço pega/solta · Esc cancela</span></div><aside class="workshop-controls"><h3 id="title"></h3><p id="workshopHint" role="status" aria-live="polite"></p><button id="workshopConfirm">Guardar e continuar</button><button id="workshopRedo">Refazer etapa</button></aside></div></section></section>
<script>// Neutral kite construction. Species identity is deliberately absent from this model.
const CRAFT_CLASSES={
 common:{label:'Comum',shape:'Diamante',sides:4,tolerance:25,cutTolerance:22,pull:[24,64]},
 uncommon:{label:'Incomum',shape:'Hexagonal',sides:6,tolerance:21,cutTolerance:18,pull:[29,60]},
 rare:{label:'Raro',shape:'Estrela de vento',sides:8,tolerance:17,cutTolerance:14,pull:[33,57]}
};
function craftClass(value){return ({comum:'common',incomum:'uncommon',raro:'rare',rara:'rare',epic:'rare',legendary:'rare',épico:'rare',lendário:'rare'})[value]|| (CRAFT_CLASSES[value]?value:'common');}
function craftGeometry(kind='common'){
 const c=CRAFT_CLASSES[craftClass(kind)],center={x:480,y:294},points=Array.from({length:c.sides},(_,i)=>{
  const a=-Math.PI/2+i*Math.PI*2/c.sides,r=c.sides===8&&i%2?142:184;
  return {x:center.x+Math.cos(a)*r,y:center.y+Math.sin(a)*r};
 });
 const samples=[];points.forEach((p,i)=>{const q=points[(i+1)%points.length],n=Math.ceil(Math.hypot(q.x-p.x,q.y-p.y)/9);for(let j=0;j<n;j++)samples.push({x:p.x+(q.x-p.x)*j/n,y:p.y+(q.y-p.y)*j/n});});
 return {center,points,samples,rods:points.map(p=>({x:(p.x+480)/2,y:(p.y+294)/2,a:p,b:center}))};
}
function createCraft(kind='common',stage=0){
 kind=craftClass(kind);return {version:2,kind,stage,tool:stage===0?'pinça':stage===1?'linha':stage===2?'tesoura':stage===3?'vento':'pinça',rods:[],knots:[],cut:[],glue:[],seated:false,damage:0,grade:100,balance:32,tested:false,tail:false,synced:false,drag:null,cursor:{x:480,y:294},last:null,carrying:null,cutPhase:'cut',light:true,paused:false,message:'',flash:0};
}
const CRAFT_TOOLS=[['pinça','Pinça'],['linha','Linha'],['tesoura','Tesoura'],['cola','Cola'],['vento','Vento'],['luz','Gabarito']];
function craftReady(s){const n=craftGeometry(s.kind).points.length;return !craftFailed(s)&&(s.stage===0?s.rods.length===n:s.stage===1?s.knots.length===n:s.stage===2?s.seated:s.stage===3?s.tested&&Math.abs(s.balance-50)<14:s.stage===4?s.tail&&s.synced:true);}
function craftFailed(s){return s.damage>=100;}
function craftProgress(s){if(s.stage>=5)return 1;const g=craftGeometry(s.kind);return s.stage===0?s.rods.length/g.points.length:s.stage===1?s.knots.length/g.points.length:s.stage===2?s.cutPhase==='cut'?s.cut.length/g.samples.length*.5:s.cutPhase==='glue'?.5+s.glue.length/g.points.length*.35:s.seated?1:.85:s.stage===3?s.tested?1-Math.min(1,Math.abs(s.balance-50)/50):0:s.tail?(s.synced?1:.6):0;}
function craftInstruction(s){
 if(craftFailed(s))return 'O papel rasgou. Refaça a etapa; a rabiola está segura.';
 if(craftReady(s))return s.stage===4?'O elo respondeu. Desperte seu parceiro.':'Pronto! Confirme para guardar esta etapa.';
 if(s.stage===0)return s.carrying?'Leve a vareta ao encaixe pontilhado e solte.':'Pegue uma vareta na bandeja à direita com a pinça.';
 if(s.stage===1)return 'Puxe a linha de cada união até a faixa marcada e solte.';

function update(){const ready=craftReady(state);$('steps').replaceChildren(...names.map((n,i)=>{const el=document.createElement('span');el.textContent=(i<state.stage?'✓ ':i+1+' ')+n;if(i===state.stage)el.setAttribute('aria-current','step');return el;}));$('title').textContent=state.stage===5?'Rabbito despertou!':names[state.stage]+' · bancada de prática';$('workshopHint').textContent=state.stage===5?'Sua construção ganhou vida. Prévia sem conta ou consumo de materiais.':ready?craftInstruction(state):(state.message||craftInstruction(state));$('class').textContent=CRAFT_CLASSES[state.kind].label+' · '+CRAFT_CLASSES[state.kind].shape+' · '+Math.round(craftProgress(state)*100)+'%';$('workshopConfirm').disabled=!ready;$('workshopConfirm').hidden=state.stage>=5;$('workshopConfirm').textContent=state.stage===4?'Despertar':'Guardar e continuar';$('workshopRedo').hidden=state.stage>=5;$('tools').hidden=state.stage>=5;$('pause').hidden=state.stage>=5;$('pause').textContent=state.paused?'Retomar':'Pausar';}
const controller=createCraftControls({canvas:$('scene'),tools:$('tools'),getState:()=>state,onChange:update});
$('workshopConfirm').onclick=()=>{if(craftReady(state)){state=createCraft(state.kind,state.stage+1);controller.refresh();}};$('workshopRedo').onclick=()=>{state=createCraft(state.kind,state.stage);controller.refresh();};$('difficulty').onchange=()=>{state=createCraft($('difficulty').value);controller.refresh();};$('reset').onclick=()=>{state=createCraft(state.kind);controller.refresh();};$('pause').onclick=()=>{state.paused=!state.paused;craftCancel(state);controller.refresh();};$('motion').onclick=()=>{reduced=!reduced;$('motion').textContent=reduced?'Ativar movimento':'Reduzir movimento';$('motion').setAttribute('aria-pressed',String(reduced));};
function creature(g,t){const rects={"body":[112,172,334,425],"happy":[620,595,312,413],"earNear":[640,27,324,464],"earFar":[1250,65,165,448],"tail":[55,690,452,274],"frame":[1140,645,352,332]};function p(id,x,y,w,h,a=0,px=.5,py=.5){g.save();g.translate(x,y);g.rotate(a);g.drawImage(parts,...rects[id],-w*px,-h*py,w,h);g.restore();}if(!parts.naturalWidth)return;g.scale(1.5,1.5);p('tail',-52,43,128,85,reduced?0:Math.sin(t*2)*.04,.9);p('body',0,30,148,178);p('earFar',28,-47,42,113,0,.5,.94);p('earNear',-25,-47,66,119,0,.5,.94);}
function tick(t){if(!document.hidden&&!state.paused)clock+=last?Math.min((t-last)/1000,.05):0;last=t;drawCraftWorkshop($('scene').getContext('2d'),state,clock,{bench,reduced,drawCreature:creature});requestAnimationFrame(tick);}document.addEventListener('visibilitychange',()=>{last=0;craftCancel(state);});controller.refresh();requestAnimationFrame(tick);
</script></html>
