<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elo das Ruínas · Revisão responsiva</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06131d;color:#e9e1cd;font:14px system-ui;overflow:hidden}header{height:70px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px}button{background:#122c38;color:inherit;border:1px solid #52716f;padding:8px 14px;border-radius:4px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#d8bd82;background:#263d41}#size{font-size:12px;color:#a8bbb5}main{height:calc(100dvh - 70px);display:flex;justify-content:center;align-items:center}#frame{position:relative}iframe{position:absolute;inset:0;border:0;transform-origin:0 0;background:#071723}</style>
<header><button data-w="1280" data-h="720" aria-pressed="true">Desktop</button><button data-w="390" data-h="844" aria-pressed="false">Celular</button><button data-w="844" data-h="390" aria-pressed="false">Horizontal</button><button id="replay">Rever abertura</button><button id="menu">Menu principal</button><span id="size"></span></header><main><div id="frame"><iframe title="Tela de abertura em revisão" src="http://127.0.0.1:5230/?title=1" allow="gamepad"></iframe></div></main>
<script>let w=1280,h=720;const frame=document.querySelector('#frame'),view=frame.querySelector('iframe');function fit(){const scale=Math.min((innerWidth-30)/w,(innerHeight-95)/h,1);frame.style.width=w*scale+'px';frame.style.height=h*scale+'px';view.style.width=w+'px';view.style.height=h+'px';view.style.transform='scale('+scale+')';document.querySelector('#size').textContent=w+' × '+h+' CSS px';}for(const b of document.querySelectorAll('[data-w]'))b.onclick=()=>{w=+b.dataset.w;h=+b.dataset.h;for(const other of document.querySelectorAll('[data-w]'))other.setAttribute('aria-pressed',String(other===b));fit();};document.querySelector('#replay').onclick=()=>view.src='http://127.0.0.1:5230/?title=1';document.querySelector('#menu').onclick=()=>view.src='http://127.0.0.1:5230/?title=0';addEventListener('resize',fit);fit();</script></html>
