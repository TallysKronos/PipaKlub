<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parque das Pipas · Continuidade dos tiles</title>
<style>*{box-sizing:border-box}body{margin:0;background:#142c30;color:#f3ead2;font:14px system-ui}header{padding:18px 25px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}h1{font:700 24px Georgia;margin:0 auto 0 0}select,button{font:inherit;padding:8px;background:#29464b;color:inherit;border:1px solid #779185;border-radius:5px}main{padding:0 20px 25px;display:grid;grid-template-columns:1fr;gap:20px}main.compare{grid-template-columns:1fr 1fr}.old{display:none}.compare .old{display:block}section{min-width:0}main:not(.compare)>section:last-child{width:100%;max-width:calc((100dvh - 190px)*1.5);margin-inline:auto}canvas{display:block;width:100%;height:auto;background:#7e9856;border:1px solid #7e9856}h2{font-size:13px;font-weight:500;margin:10px 0}#status{margin:0 25px 15px;color:#bad0c3}@media(max-width:700px){main.compare{grid-template-columns:1fr}}</style>
<header><h1>Parque das Pipas</h1><label>Área <select id="scene"><option value="park-trail">Jardim das Pipas</option><option value="park-clearing">Clareira do Papel</option></select></label><button id="compare" aria-pressed="false">Comparar antes / depois</button><button id="geometry" aria-pressed="false">Mostrar navegação</button><button id="walk">Caminhar até o descanso</button></header><p id="status">Carregando atlas…</p><main><section class="old"><h2>Antes</h2><canvas id="old" width="1536" height="1024"></canvas></section><section><h2 id="caption">Mapa atual · renderizador do jogo</h2><canvas id="current" width="1536" height="1024"></canvas></section></main>
<script type="module">
import {drawWorldArtGround} from '/src/world-art.js';import {worldRenderQueue,drawWorldObject} from '/src/world-map.js';import {createWorldNavigation} from '/src/world-navigation.js';
const $=id=>document.getElementById(id),images=new Map();let data,previous,geometry=false,nav,actor,last=0;
async function load(){[data,previous]=await Promise.all([fetch('/config').then(r=>r.json()),fetch('/config?before').then(r=>r.json())]);const sheets=new Set([...Object.values(data.scenes),...Object.values(previous.scenes)].flatMap(s=>Object.keys(s.art.kit.sheets)));await Promise.all([...sheets].map(id=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images.set('world-kit-'+id,im);resolve();};im.onerror=()=>reject(Error('Atlas indisponível: '+id));im.src='/assets/'+([...Object.values(data.scenes),...Object.values(previous.scenes)].find(s=>s.art.kit.sheets[id]).art.kit.sheets[id].image);})));const kael=new Image();await new Promise((resolve,reject)=>{kael.onload=resolve;kael.onerror=reject;kael.src='/assets/'+data.images['plaza-kael'].image;});images.set('kael',kael);setup();draw();requestAnimationFrame(tick);}
function map(canvas,scene){const g=canvas.getContext('2d');g.clearRect(0,0,canvas.width,canvas.height);drawWorldArtGround(g,scene,images);const people=canvas.id==='current'&&actor?[{...actor,id:'player',draw:()=>{const f=data.actor.frames[actor.direction+(actor.moving&&Math.floor(performance.now()/170)%2?4:0)],b=f.bounds,k=scene.actorSize/380;g.drawImage(images.get('kael'),f.x,f.y,f.w,f.h,actor.x-(b.x+b.w/2)*k,actor.y-(b.y+b.h)*k,f.w*k,f.h*k);}}]:[];for(const item of worldRenderQueue(scene,people)){if(item.kind==='actor')item.draw();else drawWorldObject(g,item,images);}if(geometry){g.save();for(const r of scene.tiled.layers.Solids){g.strokeStyle='#ff5555';g.strokeRect(r.x,r.y,r.w,r.h);}for(const r of scene.tiled.layers.Walkable.filter(r=>r.properties.encounter_zone)){g.strokeStyle='#ffc800';g.strokeRect(r.x,r.y,r.w,r.h);}for(const p of scene.places){const [x,y]=scene.nodes[p.node];g.fillStyle='#062d49';g.beginPath();g.arc(x,y,9,0,Math.PI*2);g.fill();}g.restore();}}
function setup(){nav=createWorldNavigation(data.scenes[$('scene').value]);actor=nav.create();}
function tick(t){if(!document.hidden){if(last)nav.step(actor,Math.min(.08,(t-last)/1000));map($('current'),data.scenes[$('scene').value]);}last=t;requestAnimationFrame(tick);}
function draw(){const id=$('scene').value;map($('current'),data.scenes[id]);map($('old'),previous.scenes[id]);const scene=data.scenes[id],nav=createWorldNavigation(scene),actor=nav.create();const reachable=scene.places.filter(p=>{const[x,y]=scene.nodes[p.node];return nav.target(actor,{x,y}).length;}).length;$('status').textContent=scene.name+' · '+reachable+'/'+scene.places.length+' destinos alcançáveis · '+scene.art.objects.length+' peças';}
$('scene').onchange=()=>{setup();draw();};$('walk').onclick=()=>{const scene=data.scenes[$('scene').value],place=scene.places.find(p=>p.action==='wildRest'),[x,y]=scene.nodes[place.node];nav.target(actor,{x,y});};$('current').onclick=event=>{const r=event.currentTarget.getBoundingClientRect();nav.target(actor,{x:(event.clientX-r.left)*1536/r.width,y:(event.clientY-r.top)*1024/r.height});};$('compare').onclick=()=>{const show=document.querySelector('main').classList.toggle('compare');$('compare').setAttribute('aria-pressed',String(show));};$('geometry').onclick=()=>{geometry=!geometry;$('geometry').setAttribute('aria-pressed',String(geometry));draw();};load().catch(e=>$('status').textContent=e.message);
</script></html>
