<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img"><style>text{font-family:Arial,sans-serif;fill:#19392f;font-size:18px}.title{font-size:23px;font-weight:bold}.small{font-size:15px}</style><rect width="1000" height="445" fill="#f7f2e6"/><text x="30" y="34" class="title">02 · Responsabilidades separadas</text><rect x="30" y="60" width="940" height="59" rx="5" fill="#d0b99a"/><text x="49" y="96" class="title">1</text><text x="92" y="96" font-weight="bold">SUPORTE</text><text x="295" y="96">Células, alturas, rampas e recortes</text><rect x="30" y="132" width="940" height="59" rx="5" fill="#89a95a"/><text x="49" y="168" class="title">2</text><text x="92" y="168" font-weight="bold">MATERIAL</text><text x="295" y="168">Grama / terra / piso, sem buracos</text><rect x="30" y="204" width="940" height="59" rx="5" fill="#d8ba82"/><text x="49" y="240" class="title">3</text><text x="92" y="240" font-weight="bold">TRANSIÇÃO</text><text x="295" y="240">Um contorno compartilhado entre materiais</text><rect x="30" y="276" width="940" height="59" rx="5" fill="#bfd099"/><text x="49" y="312" class="title">4</text><text x="92" y="312" font-weight="bold">DECALQUES</text><text x="295" y="312">Detalhes esparsos, sem mudar colisão</text><rect x="30" y="348" width="940" height="59" rx="5" fill="#6e8c76"/><text x="49" y="384" class="title">5</text><text x="92" y="384" font-weight="bold">VOLUMES</text><text x="295" y="384">Objetos apoiados e sombras coerentes</text></svg>