<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kael · Avatar no cenário</title><link rel="stylesheet" href="/src/switch-ui.css"><style>
body{margin:0;background:#17323b;color:#fff1d0;font:15px system-ui}main{max-width:1280px;margin:auto;padding:24px}h1{margin:0 0 8px}p{line-height:1.5}.review-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:24px}canvas#room{width:100%;background:#486960;border-radius:16px}#appearance{background:#fff5de;color:#24443e;border-radius:16px;padding:16px}button,select{font:inherit;min-height:44px;border-radius:12px;padding:8px 16px;border:1px solid #8a9a7b}button{background:#edcd80;color:#173b3c;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,select:focus-visible{outline:3px solid #579dd7;outline-offset:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.avatar-appearance{margin:0;border:0}.avatar-previews canvas{width:100%}@media(max-width:850px){.review-layout{grid-template-columns:1fr}}

</style><main><h1>Kael no cenário</h1><p>Prévia local com o avatar e o renderizador do jogo. Clique no piso ou use WASD / setas. As cores da prévia são independentes da sua conta.</p><div class="review-layout"><section><div class="actions"><button id="roomSwitch">Ver quarto</button><button id="stairs">Subir escada</button><button id="seat">Sentar no sofá</button></div><div class="inspection" role="group" aria-label="Inspeção do cenário"><button id="zoomOut" aria-label="Diminuir zoom">−</button><output id="zoomValue" aria-live="polite">100%</output><button id="zoomIn" aria-label="Aumentar zoom">+</button><button id="centerActor">Centralizar Kael</button><button id="fitRoom">Ver ambiente inteiro</button></div><div class="room-viewport" id="roomViewport" role="region" aria-label="Cenário com rolagem para inspeção"><canvas id="room" width="960" height="720" tabindex="0" aria-label="Cenário isométrico interativo"></canvas></div><p class="room-hint">Use + e − para inspecionar. Com zoom, role a área para mover a vista.</p><p id="status" role="status">Carregando desenhos…</p></section><section id="appearance"></section></div></main><script type="module" src="/tools/avatar-studio/game-review.mjs"></script></html>
