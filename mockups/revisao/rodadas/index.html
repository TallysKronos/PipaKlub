<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Revisão das batalhas</title><style>body{margin:24px;background:#141e29;color:#f4e9d2;font:17px system-ui}main{max-width:1280px;margin:auto}h1{font-size:25px}p{color:#d8c9ac}img{width:100%;display:block;border:2px solid #33475a}nav{display:flex;gap:12px;align-items:center;margin:18px 0;flex-wrap:wrap}button,select{font:inherit;padding:10px;background:#22303f;color:#f4e9d2;border:2px solid #2ec8e3;border-radius:4px}input{flex:1;min-width:220px;accent-color:#2ec8e3}small{display:block;margin-top:16px;color:#d8c9ac}</style><main><h1>Revisão das batalhas</h1><p>Sequências de rodadas completas no Godot. Entradas de controle simuladas; nenhum save do jogador foi usado.</p><nav><select id="scenario"></select><button id="play">Reproduzir</button><button id="previous">Anterior</button><button id="next">Próxima</button><input id="time" type="range" min="0" value="0"><span id="caption"></span></nav><img id="screen" alt="Captura da batalha"><small>Reprodução acelerada de capturas. Os intervalos são menores quando um aviso de golpe aparece; não é um vídeo contínuo.</small></main><script>const data=[{"name":"Mata Verde","frames":[{"file":"battle-0000.png","time":0},{"file":"battle-0060.png","time":3},{"file":"battle-0112.png","time":5.6000000000000005},{"file":"battle-0120.png","time":6},{"file":"battle-0154.png","time":7.7},{"file":"battle-0180.png","time":9},{"file":"battle-0240.png","time":12},{"file":"battle-0258.png","time":12.9},{"file":"battle-0300.png","time":15},{"file":"battle-0346.png","time":17.3},{"file":"battle-0360.png","time":18},{"file":"battle-0409.png","time":20.450000000000003},{"file":"battle-final.png","time":20.5}]},{"name":"Morro · três participantes","frames":[{"file":"morro-battle-0000.png","time":0},{"file":"morro-battle-0049.png","time":2.45},{"file":"morro-battle-0060.png","time":3},{"file":"morro-battle-0088.png","time":4.4},{"file":"morro-battle-0120.png","time":6},{"file":"morro-battle-0180.png","time":9},{"file":"morro-battle-0240.png","time":12},{"file":"morro-battle-0286.png","time":14.3},{"file":"morro-battle-0300.png","time":15},{"file":"morro-battle-0360.png","time":18},{"file":"morro-battle-0420.png","time":21},{"file":"morro-battle-0445.png","time":22.25},{"file":"morro-battle-0453.png","time":22.650000000000002},{"file":"morro-battle-final.png","time":22.7}]},{"name":"Lacertubo","frames":[{"file":"boss-intro-0000.png","time":0},{"file":"boss-intro-0060.png","time":3},{"file":"boss-intro-0120.png","time":6},{"file":"boss-intro-0180.png","time":9},{"file":"boss-intro-0240.png","time":12},{"file":"boss-intro-0252.png","time":12.600000000000001},{"file":"boss-intro-0300.png","time":15},{"file":"boss-intro-0360.png","time":18},{"file":"boss-intro-0388.png","time":19.400000000000002},{"file":"boss-intro-0420.png","time":21},{"file":"boss-intro-0441.png","time":22.05},{"file":"boss-intro-0480.png","time":24},{"file":"boss-intro-0494.png","time":24.700000000000003},{"file":"boss-intro-0540.png","time":27},{"file":"boss-intro-0547.png","time":27.35},{"file":"boss-intro-0600.png","time":30},{"file":"boss-intro-0609.png","time":30.450000000000003},{"file":"boss-intro-final.png","time":30.5}]}];let timer=null;const select=document.querySelector('#scenario'),slider=document.querySelector('#time'),screen=document.querySelector('#screen'),caption=document.querySelector('#caption');for(const r of data){const o=document.createElement('option');o.textContent=r.name;select.append(o)}function show(){const r=data[select.selectedIndex],f=r.frames[Number(slider.value)];screen.src=f.file;caption.textContent=f.time.toFixed(1)+' s · '+(Number(slider.value)+1)+' / '+r.frames.length}function change(){slider.max=data[select.selectedIndex].frames.length-1;slider.value=0;show()}select.onchange=change;slider.oninput=show;document.querySelector('#previous').onclick=()=>{slider.value=Math.max(0,Number(slider.value)-1);show()};function next(){slider.value=(Number(slider.value)+1)%(Number(slider.max)+1);show()}document.querySelector('#next').onclick=next;document.querySelector('#play').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='Reproduzir'}else{timer=setInterval(next,550);e.target.textContent='Pausar'}};change();</script></html>
