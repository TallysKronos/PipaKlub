services:
  - type: web
    name: pipaklub
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: GUEST_PLAY_ENABLED
        value: "1"
