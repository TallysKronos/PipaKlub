name = "construtor-de-mapas"
description = "Constrói e revisa áreas exploráveis do overworld do Soulmonsters no Godot: planta, relevo, platôs, barrancos, muretas, rampas, escadas, pontes, água, vegetação, itens e eventos. Entrega mapa sem junta quebrada, conferido em captura geométrica e com arte, no nível de Digimon World DS e Digimon World 2003. Use para criar, corrigir ou melhorar qualquer mapa de exploração."

