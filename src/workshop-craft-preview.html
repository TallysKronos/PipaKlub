<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Oficina das Almas · bancada jogável</title>
<style>html,body{margin:0;background:#193d40;color:#fff0ca;font-family:system-ui}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #ffd987;outline-offset:2px}[hidden]{display:none!important}/* CRAFT_STYLE */</style>
<section class="workshop-room craft-mode is-building"><section id="workshopBuild"><div class="workshop-hud"><button id="reset" class="secondary">↶ Nova pipa</button><nav class="workshop-steps" id="steps" aria-label="Etapas da fabricação"></nav><select id="difficulty" aria-label="Classe do gabarito"><option value="common">Comum</option><option value="uncommon">Incomum</option><option value="rare">Raro</option></select></div><div class="workshop-layout"><div class="workshop-scene"><canvas id="scene" width="960" height="640" aria-label="Bancada de montagem: gabarito no centro, ferramentas à esquerda e materiais à direita"></canvas><div id="tools" class="craft-tools" role="group" aria-label="Ferramentas da bancada"></div><span id="class" class="craft-class"></span><button id="motion" class="workshop-motion">Reduzir movimento</button><button id="pause" class="craft-pause">Pausar</button><span class="craft-key-help">1–6 ferramentas · Setas movem · Espaço pega/solta · Esc cancela</span></div><aside class="workshop-controls"><h3 id="title"></h3><p id="workshopHint" role="status" aria-live="polite"></p><button id="workshopConfirm">Guardar e continuar</button><button id="workshopRedo">Refazer etapa</button></aside></div></section></section>
<script>/* CRAFT_RUNTIME */
const $=id=>document.getElementById(id),names=['Armação','Nós','Papel','Voo','Elo'];let state=createCraft(),clock=0,last=0,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,loaded=false;
const bench=new Image(),parts=new Image();bench.src='assets/workshop/v2/bench.png';parts.src='assets/workshop/v1/rabbito-parts.png';bench.onload=()=>loaded=true;bench.onerror=()=>{$('workshopHint').textContent='Não foi possível carregar a bancada. Recarregue para tentar novamente.';};
function update(){const ready=craftReady(state);$('steps').replaceChildren(...names.map((n,i)=>{const el=document.createElement('span');el.textContent=(i<state.stage?'✓ ':i+1+' ')+n;if(i===state.stage)el.setAttribute('aria-current','step');return el;}));$('title').textContent=state.stage===5?'Rabbito despertou!':names[state.stage]+' · bancada de prática';$('workshopHint').textContent=state.stage===5?'Sua construção ganhou vida. Prévia sem conta ou consumo de materiais.':ready?craftInstruction(state):(state.message||craftInstruction(state));$('class').textContent=CRAFT_CLASSES[state.kind].label+' · '+CRAFT_CLASSES[state.kind].shape+' · '+Math.round(craftProgress(state)*100)+'%';$('workshopConfirm').disabled=!ready;$('workshopConfirm').hidden=state.stage>=5;$('workshopConfirm').textContent=state.stage===4?'Despertar':'Guardar e continuar';$('workshopRedo').hidden=state.stage>=5;$('tools').hidden=state.stage>=5;$('pause').hidden=state.stage>=5;$('pause').textContent=state.paused?'Retomar':'Pausar';}
const controller=createCraftControls({canvas:$('scene'),tools:$('tools'),getState:()=>state,onChange:update});
$('workshopConfirm').onclick=()=>{if(craftReady(state)){state=createCraft(state.kind,state.stage+1);controller.refresh();}};$('workshopRedo').onclick=()=>{state=createCraft(state.kind,state.stage);controller.refresh();};$('difficulty').onchange=()=>{state=createCraft($('difficulty').value);controller.refresh();};$('reset').onclick=()=>{state=createCraft(state.kind);controller.refresh();};$('pause').onclick=()=>{state.paused=!state.paused;craftCancel(state);controller.refresh();};$('motion').onclick=()=>{reduced=!reduced;$('motion').textContent=reduced?'Ativar movimento':'Reduzir movimento';$('motion').setAttribute('aria-pressed',String(reduced));};
function creature(g,t){const rects=/* CRAFT_RECTS */;function p(id,x,y,w,h,a=0,px=.5,py=.5){g.save();g.translate(x,y);g.rotate(a);g.drawImage(parts,...rects[id],-w*px,-h*py,w,h);g.restore();}if(!parts.naturalWidth)return;g.scale(1.5,1.5);p('tail',-52,43,128,85,reduced?0:Math.sin(t*2)*.04,.9);p('body',0,30,148,178);p('earFar',28,-47,42,113,0,.5,.94);p('earNear',-25,-47,66,119,0,.5,.94);}
function tick(t){if(!document.hidden&&!state.paused)clock+=last?Math.min((t-last)/1000,.05):0;last=t;drawCraftWorkshop($('scene').getContext('2d'),state,clock,{bench,reduced,drawCreature:creature});requestAnimationFrame(tick);}document.addEventListener('visibilitychange',()=>{last=0;craftCancel(state);});controller.refresh();requestAnimationFrame(tick);
</script></html>
